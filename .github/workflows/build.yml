name: Build Windows app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/WhisperAutoGenSubs/WhisperAutoGenSubs.csproj --configuration Release 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
